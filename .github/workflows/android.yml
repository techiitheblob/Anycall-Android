name: Build AnyCall Android APK

on:
  push:
    branches: [ main, master, feature-* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found, building with system gradle"
            gradle assembleDebug
          fi

      - name: Upload Compiled APK Binary Artifact
        uses: actions/upload-artifact@v3
        with:
          name: AnyCall-FieldStation-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
            public/*.apk
          if-no-files-found: warn
